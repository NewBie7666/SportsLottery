[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sporttery-national"
version = "0.1.0"
description = "CLI MVP for China Sports Lottery national-team win/draw/loss probability analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.4", "joblib>=1.3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
